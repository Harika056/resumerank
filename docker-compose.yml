services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      EMBEDDER: sentence-transformers
    ports:
      - "8000:8000"
    volumes:
      - resumerank-data:/data

volumes:
  resumerank-data:
